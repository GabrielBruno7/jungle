global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    environment: local

scrape_configs:
  - job_name: jungle-app
    metrics_path: /metrics
    dns_sd_configs:
      - names:
          - app
        type: A
        port: 8080
        refresh_interval: 10s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
